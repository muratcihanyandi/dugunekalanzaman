<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Şule &amp; Berkay · Düğünümüze kalan süre</title>
<meta name="description" content="Şule &amp; Berkay'ın düğününe kalan süre.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FBEDEE">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/fonts.css">
<link rel="stylesheet" href="assets/css/main.css">
<script>document.documentElement.classList.add("js");</script>
</head>
<body>

<canvas class="petals" id="petals" aria-hidden="true"></canvas>

<main class="stage" id="stage">

  <div class="env-scene" id="envScene">
    <div class="envelope" id="envelope">
      <div class="env-back" aria-hidden="true"></div>
      <div class="env-pocket" aria-hidden="true"></div>
      <div class="env-flap" aria-hidden="true">
        <div class="flap-face flap-front"></div>
        <div class="flap-face flap-back"></div>
      </div>
      <div class="env-stamp" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 20.6C6.2 16.2 3 13 3 9.5 3 6.9 4.9 5 7.4 5c1.8 0 3.4 1 4.6 2.7C13.2 6 14.8 5 16.6 5 19.1 5 21 6.9 21 9.5c0 3.5-3.2 6.7-9 11.1z"/></svg>
        <span>25.10</span>
      </div>
      <button class="env-seal" id="seal" type="button" aria-label="Zarfı açmak için mühüre dokun">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.6C6.2 16.2 3 13 3 9.5 3 6.9 4.9 5 7.4 5c1.8 0 3.4 1 4.6 2.7C13.2 6 14.8 5 16.6 5 19.1 5 21 6.9 21 9.5c0 3.5-3.2 6.7-9 11.1z"/></svg>
      </button>
    </div>
    <p class="env-hint" id="envHint"><span class="env-hint-pulse" aria-hidden="true"></span>açmak için mühüre dokun</p>
    <div class="env-shadow" aria-hidden="true"></div>
  </div>

  <article class="letter" id="letterCard" tabindex="0" aria-label="Düğün geri sayım kartı; tam ekran yapmak için tıklayın">
    <span class="tape tape-a" aria-hidden="true"></span>
    <span class="tape tape-b" aria-hidden="true"></span>
    <svg class="letter-flower" viewBox="0 0 64 64" aria-hidden="true">
      <g class="lf-petals">
        <ellipse cx="32" cy="15" rx="6" ry="11"/>
        <ellipse cx="32" cy="15" rx="6" ry="11" transform="rotate(72 32 32)"/>
        <ellipse cx="32" cy="15" rx="6" ry="11" transform="rotate(144 32 32)"/>
        <ellipse cx="32" cy="15" rx="6" ry="11" transform="rotate(216 32 32)"/>
        <ellipse cx="32" cy="15" rx="6" ry="11" transform="rotate(288 32 32)"/>
      </g>
      <circle class="lf-core" cx="32" cy="32" r="5.5"/>
      <path class="lf-stem" d="M32 44v16"/>
      <path class="lf-leaf" d="M32 52c-6-1-9-4-10-8 5 0 9 3 10 8z"/>
      <path class="lf-leaf" d="M32 56c6-1 9-4 10-8-5 0-9 3-10 8z"/>
    </svg>

    <h1 class="lt-names">
      <span data-cfg="name-a">Şule</span>
      <span class="lt-amp">&amp;</span>
      <span data-cfg="name-b">Berkay</span>
    </h1>

    <svg class="lt-wave" viewBox="0 0 140 16" aria-hidden="true"><path d="M2 8q8.5-6.5 17 0t17 0t17 0t17 0t17 0t17 0t17 0t17 0"/></svg>

    <p class="lt-count-title">Düğünümüze kalan süre</p>

    <div class="countdown" id="countdown" role="timer" aria-label="Düğüne kalan süre">
      <div class="cd-tile">
        <span class="cd-num" id="cdD"><span class="slot cur">—</span></span>
        <span class="cd-label">gün</span>
      </div>
      <div class="cd-tile">
        <span class="cd-num" id="cdH"><span class="slot cur">—</span></span>
        <span class="cd-label">saat</span>
      </div>
      <div class="cd-tile">
        <span class="cd-num" id="cdM"><span class="slot cur">—</span></span>
        <span class="cd-label">dakika</span>
      </div>
      <div class="cd-tile">
        <span class="cd-num" id="cdS"><span class="slot cur">—</span></span>
        <span class="cd-label">saniye</span>
      </div>
      <noscript><p class="cd-noscript">Geri sayım için JavaScript'in açık olması gerekiyor.</p></noscript>
    </div>
  </article>

  <p class="card-hint" aria-hidden="true"><span class="env-hint-pulse"></span>tam ekran için karta dokun</p>

  <noscript><style>
    .letter { opacity: 1 !important; transform: none !important; pointer-events: auto !important; }
    .env-scene, .card-hint { display: none !important; }
  </style></noscript>

</main>

<script src="assets/js/main.js" defer></script>
</body>
</html>
